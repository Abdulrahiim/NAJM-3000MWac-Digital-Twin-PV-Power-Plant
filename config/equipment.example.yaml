idts:

  idt_vendor_a_8_932_mva:
    description: "IDT — Vendor A, 8.932 MVA, 33 kV / 660 V (placeholder)"
    rated_power_mva: 8.932
    hv_voltage_kv: 33.0
    lv_voltage_kv: 0.66
    provenance_note: "Source: SRC-010"

    p_no_load:
      value: PLACEHOLDER   # W — no-load (core) losses
      unit: "W"
      provenance:
        source_id: "SRC-010"
        data_quality_status: "Provisional"
        confidence: "Medium"
    p_load_rated:
      value: PLACEHOLDER   # W — load losses at rated power
      unit: "W"
      provenance:
        source_id: "SRC-010"
        data_quality_status: "Provisional"
        confidence: "Medium"
    # Loss formula: P_loss = p_no_load + p_load_rated × load_fraction²

  idt_vendor_a_4_466_mva:
    description: "IDT — Vendor A, 4.466 MVA, 33 kV / 660 V (placeholder)"
    rated_power_mva: 4.466
    hv_voltage_kv: 33.0
    lv_voltage_kv: 0.66
