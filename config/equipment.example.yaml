    p_no_load:
      value: PLACEHOLDER   # W — ambiguous in SRC-011; see GAP-006
      unit: "W"
      provenance:
        gap_id: "GAP-006"
        data_quality_status: "Missing"
        confidence: "Low"
        notes: "IDT no-load loss row ambiguous in SRC-011 — must not be assumed from 8.932 MVA variant"
    p_load_rated:
      value: PLACEHOLDER
      unit: "W"
      provenance:
        source_id: "SRC-011"
        data_quality_status: "Provisional"
        confidence: "Low"

# ---------------------------------------------------------------------------
# TRACKERS
# ---------------------------------------------------------------------------

trackers:

  tracker_vendor_a_model_1:
    description: "Single-Axis Tracker — Vendor A, 1-in-portrait (placeholder)"
    type: "single_axis"
    modules_per_table: PLACEHOLDER   # Integer
    provenance_note: "Source: SRC-012"

    axis_tilt:
      value: 0.0        # degrees — horizontal axis (adjust per terrain)
      unit: "degrees"
      provenance:
        source_id: "SRC-012"
        data_quality_status: "Provisional"
        confidence: "Medium"
    axis_azimuth:
      value: 180.0      # degrees — N-S axis (180 = south-facing in NH convention)
      unit: "degrees"
      provenance:
        source_id: "SRC-012"
        data_quality_status: "Provisional"
        confidence: "Medium"
    max_angle:
      value: 60.0       # degrees — from ASMP-001 / SRC-012
      unit: "degrees"
      provenance:
        source_id: "SRC-012"
        assumption_id: "ASMP-001"
        data_quality_status: "Provisional"
        confidence: "Medium"
    backtrack: true
    axis_height:
      value: 1.5        # m — from ASMP-002 / SRC-012
      unit: "m"
      provenance:
        assumption_id: "ASMP-002"
        data_quality_status: "Assumed"
        confidence: "Medium"

  tracker_vendor_b_model_1:
    description: "Single-Axis Tracker — Vendor B (placeholder — no datasheet)"
    type: "single_axis"
    provenance_note: "No Vendor B tracker datasheet available — see GAP-010"
    max_angle:
      value: 60.0
      unit: "degrees"
      provenance:
        assumption_id: "ASMP-001"
        gap_id: "GAP-010"
        data_quality_status: "Assumed"
        confidence: "Low"
        notes: "Using Vendor A max_angle as placeholder — do not use for engineering analysis"

  tracker_vendor_c_model_1:
    description: "Single-Axis Tracker — Vendor C (placeholder — no datasheet)"
